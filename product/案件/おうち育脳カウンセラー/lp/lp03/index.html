  $('a[href^="#"]').click(function(){
    var speed = 300;
    var href= $(this).attr("href");
    var target = $(href == "#" || href == "" ? 'html' : href);
    var position = target.offset().top;
    $("html, body").animate({scrollTop:position}, speed, "swing");
    return false;
  });
	
	
  let $pagetop = $('.flbtn');

  $(window).on( 'scroll', function () {
    //スクロール位置を取得
    if ( $(this).scrollTop() < 1500 ) {
      $pagetop.css('opacity','0');
      $pagetop.css('display','none');
		
    } else {
      $pagetop.css('opacity','1');
      $pagetop.css('display','block');
    }
  });	
	
});
</script>

0,"type":"html","text":"<section class=\"bonus\">\n\n\t\t<h2><img src=\"https://utagesystem.s3.ap-northeast-1.amazonaws.com/g5kxXfM1ukUE/SWfPdfc9Z1zQisx9Q2U8Rd9CfUaVrKC7iygs2E8x.png\" alt=\"プログラム参加特典\"></h2>\n\n\t\t<div class=\"wrap_bonus\">\n\t\t\n\n\t\t\t<div class=\"con_bonus\">\n\n\t\t\t\t<img src=\"https://utagesystem.s3.ap-northeast-1.amazonaws.com/g5kxXfM1ukUE/WdLb0jPpd4E1440Bk1xNBwJ5tEzAdCxXSrGkriQb.png\" alt=\"今すぐ使える ”予想外”で子どものシナプスを刺激する 「1秒育脳ぷち」\">\n\n\t\t\t</div><!--/con_bonus-->\n\n\n\t\t</div><!--/wrap_bonus-->\n\t\t\n\t</section><!--/bonus-->\n\n\n<section class=\"who\">\n\n\t\t<h2><img src=\"https://utagesystem.s3.ap-northeast-1.amazonaws.com/g5kxXfM1ukUE/xs4PxQd9BBP8vclRk234tbWC9zDh6lDK16GwSy47.png\" alt=\"「育脳子育てカウンセラー」はこんな方におすすめです\"></h2>\n\n\t\t<div class=\"wrap_who\">\n\n\t\t\t<div class=\"con_who\">\n\t\t\t\t<img class=\"img_who_checklist\" src=\"assets/who-checklist-replacement.png?v=20260719j\" alt=\"子どもが好きだからこそ、今の働き方に悩んでしまう。\">\n\t\t\t</div><!--/con_who-->\n\n\t\t</div><!--/wrap_who-->\n\n\t</section><!--/who-->\n\t<section class=\"who-feelings\">\n\t\t<div class=\"wrap_who_feelings\">\n\t\t\t<img class=\"img_who_feelings\" src=\"assets/who-feelings-replacement.png?v=20260719j\" alt=\"実際に、多くの方がこんな悩みを抱えています。\">\n\t\t</div>\n\t</section><!--/who-feelings-->\n\t<section class=\"insight-lead\">\n\t\t<div class=\"wrap_insight_lead\">\n\t\t\t<img class=\"img_insight_lead\" src=\"assets/insight-lead-replacement.png?v=20260719j\" alt=\"はじめまして！育脳カウンセラーの「永瀬まみ」です。わたしはこれまで5,000組以上の親子をサポートする中で、ある共通点に気づきました。\">\n\t\t</div>\n\t</section><!--/insight-lead-->\n\t<section class=\"insight-story\">\n\t\t<div class=\"wrap_insight_story\">\n\t\t\t<img class=\"img_insight_story\" src=\"assets/insight-story-replacement.png?v=20260719j\" alt=\"子どもが笑顔で育つ家庭には、必ずと言っていいほど笑顔のママがいます。\">\n\t\t</div>\n\t</section><!--/insight-story-->\n\t\n\t<section class=\"contrast-question\">\n\t\t<div class=\"wrap_contrast_question\">\n\t\t\t<img class=\"img_contrast_question\" src=\"assets/contrast-question-replacement.png?v=20260719j\" alt=\"うまくいく家庭にあって、うまくいってない家庭にないもの\">\n\t\t\t<p class=\"cycle-title cycle-title-happy\">うまくいく家庭の<br class=\"sponly\">「ハッピーサイクル」</p>\n\t\t\t<img class=\"img_irritation_cycle\" src=\"assets/happy-cycle-replacement.png?v=20260719j\" alt=\"ハッピーサイクル\">\n\t\t\t<p class=\"cycle-title cycle-title-irritation\">うまくいかない家庭の<br class=\"sponly\">「イライラサイクル」</p>\n\t\t\t<img class=\"img_irritation_cycle\" src=\"assets/irritation-cycle-02.png?v=20260719j\" alt=\"イライラサイクル\">\n\t\t\t<p class=\"cycle-bridge\">このように、ママが不安や焦りを抱えていると、<br>負のループに入りやすくなります。<br>親子の関係がすれ違ったり、<br>子どもが挑戦しにくくなったりしてしまいます。</p>\n\n\t\t</div>\n\t</section><!--/contrast-question-->\n<section class=\"mama-support-lead\">\n\t\t<div class=\"wrap_mama_support_lead\">\n\t\t\t<img class=\"img_mama_support_lead\" src=\"assets/mama-support-lead-replacement.png?v=20260719j\" alt=\"本当に必要なのは、子どもだけを支えることではなく、ママを支えること。\">\n\t\t</div>\n\t</section><!--/mama-support-lead-->\n<section class=\"conclusion-story\">\n\t\t<div class=\"wrap_conclusion_story\">\n\t\t\t<picture>\n\t\t\t\t<source srcset=\"assets/conclusion-text-mobile-replacement.png?v=20260719j\" media=\"(max-width: 599px)\">\n\t\t\t\t<img class=\"img_conclusion_story\" src=\"assets/conclusion-text-replacement.png?v=20260719j\" alt=\"だから今、本当に必要とされているのが、おうち育脳カウンセラーです。\">\n\t\t\t</picture>\n\t\t</div>\n\t</section><!--/conclusion-story-->\n\n\n\n\n\n\t\t\n\t<section class=\"tokucho\">\n\n\t\t<div class=\"wrap_tokucho\">\n\t\t\n\t\t\t<picture>\n\t\t\t\t<source srcset=\"assets/tokucho-workstyle-replacement.png?v=20260719j\" media=\"(max-width: 599px)\">\n\t\t\t\t<img class=\"img_tokucho\" src=\"assets/tokucho-workstyle-replacement.png?v=20260719j\">\n\t\t\t</picture>\n\n\t\t</div><!--/wrap_tokucho-->\n\t\t\n\t</section><!--/tokucho-->\n\n\n\t\n\n\t<section class=\"workstyle-examples\">\n\t\t<div class=\"wrap_workstyle_examples\">\n\t\t\t<img class=\"img_workstyle_examples\" src=\"assets/workstyle-examples-replacement.png?v=20260720a\" alt=\"おうち育脳カウンセラーはいろんな場面で活躍できます。\">\n\t\t\t<div class=\"workstyle-invite\">\n\t\t\t\t<p class=\"workstyle-invite-voice\">「私には難しそう…」<br>「資格も経験もないし、本当にできるのかな？」</p>\n\t\t\t\t<p>そんなふうに感じている方こそ、<br>ぜひ4日間の無料LIVEレッスンにご参加ください。</p>\n\t\t\t\t<p>実際にどんな仕事なのか、<br>どんなふうにママをサポートするのか、<br>未経験から始められる理由まで、<br>わかりやすくお伝えします。</p>\n\t\t\t\t<p>まずは、「私にもできそう」を<br>あなた自身の目で確かめてみてください。</p>\n\t\t\t</div>\n\t\t</div>\n\t</section><!--/workstyle-examples-->\n\n","sid":"","children":[]}]}]}]},{"id":900000001,"is_popup":0,"type":"section","class":"tokucho02-below-form","sid":"","children":[{"id":900000002,"is_popup":0,"type":"row","sid":"","children":[{"id":900000003,"is_popup":0,"type":"col","sid":"","children":[{"id":900000004,"is_popup":0,"type":"html","text":"<section id=\"tokucho02\" class=\"tokucho02\">\n\n\t\t<div class=\"wrap_tokucho02\">\n\n\t\t\t<picture>\n\t\t\t\t<source srcset=\"assets/header-mobile-replacement.png?v=20260719j\" media=\"(max-width: 599px)\">\n\t\t\t\t<img class=\"img_tokucho02\" src=\"assets/header-replacement.png?v=20260719j\" alt=\"育脳子育てカウンセラー®の始め方\">\n\t\t\t</picture>\n\n\t\t</div><!--/wrap_tokucho02-->\n\n\t</section><!--/tokucho02-->","sid":"","children":[]}]}]}]},{"id":754635277,"is_popup":0,"type":"section","class":"form","sid":"","children":[{"id":754635278,"is_popup":0,"type":"row","class":"submit","sid":"","children":[{"id":754635279,"is_popup":0,"type":"col","sid":"","children":[{"id":754635280,"is_popup":0,"type":"html","text":"<p class=\"form-nudge\"><span>子育て経験を収入に変える秘密</span></p><p class=\"form-nudge-date\">↓8月24日(月)21:30スタート↓</p><div id=\"form-bottom\" class=\"myasp-form-wrap\"><div class=\"content_form\"><form action=\"https://my183p.com/p/r/wfkb0S1r\" enctype=\"multipart/form-data\" id=\"UserItemForm2\" class=\"myForm\" method=\"post\" accept-charset=\"utf-8\" data-myasp-item-id=\"wfkb0S1r\" data-myasp-form-id=\"wfkb0S1r\" data-myasp-page-key=\"form_page_html\" data-myasp-form-asset-version=\"8af82a9882fc\"><input type=\"hidden\" name=\"_method\" value=\"POST\"><div class=\"input text input_unit required myasp-mail-row\" data-form-key=\"Usermail\"><input name=\"data[User][mail]\" id=\"Usermail2\" value=\"\" class=\"form_input_input deco\" type=\"text\" placeholder=\"メールアドレスを入力してください\"></div><div class=\"submit form_input_submit\"><span class=\"btn_utg myasp-btn-shell\"><input type=\"image\" src=\"assets/button-replacement.png?v=20260719j\" alt=\"無料で今すぐ5日間チャレンジプログラムに参加する\" class=\"myasp-btn-image\"></span></div><input type=\"hidden\" id=\"server_url_UserItemForm2\" value=\"https://my183p.com/\"><!-- ▼リファラ --><input type=\"hidden\" name=\"data[User][referer_form_url]\" value=\"\" class=\"UserRefererFormUrl\"/><input type=\"hidden\" name=\"data[User][referer_url]\" value=\"\" class=\"UserRefererUrl\"/><script type=\"text/javascript\">//<!--\n    if (document.referrer.length !=0 ){\n        if (document.getElementsByClassName(\"UserRefererUrl\"))\n        {\n        var user_referer_url = document.getElementsByClassName(\"UserRefererUrl\");\n        for (var i = 0; i < user_referer_url.length; i++)\n        {\n            user_referer_url[i].value = document.referrer;\n        }\n        }\n        else if (document.getElementById(\"UserRefererUrl\"))\n        {\n            document.getElementById(\"UserRefererUrl\").value = document.referrer;\n        }\n    }\n\n\n    if (document.getElementsByClassName(\"UserRefererFormUrl\"))\n    {\n        var user_referer_form_url = document.getElementsByClassName(\"UserRefererFormUrl\");\n        for (var i = 0; i < user_referer_form_url.length; i++)\n        {\n            user_referer_form_url[i].value = location.href;\n        }\n    }\n    else if (document.getElementById(\"UserRefererFormUrl\"))\n    {\n        document.getElementById(\"UserRefererFormUrl\").value = location.href;\n    }\n//-->\n    </script><!-- ▲リファラ --></form></div></div>","sid":"","children":[]},{"id":754635281,"is_popup":0,"type":"text","text":"<p>Gmailなどのフリーメールアドレスでのご登録をお願いいたします。メールが確認できない場合は、迷惑フォルダもご確認ください。@icloud.com、outlook.jp、hotmail.com、mac.com、msn.comは届かない場合があります。</p>","class":"optin","sid":"","children":[]}]}]}]},{"id":754635325,"is_popup":0,"type":"section","sid":"","children":[{"id":754635326,"is_popup":0,"type":"row","sid":"","children":[{"id":754635327,"is_popup":0,"type":"col","sid":"","children":[{"id":754635328,"is_popup":0,"type":"html","text":"<div class=\"profile\">\n\t\t\t<h2><img src=\"https://utagesystem.s3.ap-northeast-1.amazonaws.com/g5kxXfM1ukUE/f8qoOenCimcPo5xTOmAGJpNZt6yGKnnaaPh8ux0I.png\" alt=\"講師紹介\"></h2>\n\t\t\t\n\t\t\t<div class=\"con_profile\">\n\t\t\t\t<div class=\"shd_profile\">\n\t\t\t\t\t<picture>\n\t\t\t\t\t\t<source srcset=\"https://utagesystem.s3.ap-northeast-1.amazonaws.com/g5kxXfM1ukUE/IRZdUzYIFDPmhhSWgDZT4NMjxL5KNq7nam1GNsdj.png\" media=\"(max-width: 768px)\">\n\t\t\t\t\t\t<img class=\"tt_shdprofile\" src=\"https://utagesystem.s3.ap-northeast-1.amazonaws.com/g5kxXfM1ukUE/gdZe5hp0Q0dcBDhO5JMk6Y29eAghQGKnOTh5LJz4.png\">\n\t\t\t\t\t</picture>\n\t\t\t\t\t<img class=\"pic_profile\" src=\"assets/profile-photo-replacement.png?v=20260719j\">\n\t\t\t\t</div><!-- /shd_profile -->\n\t\t\t\t\n\t\t\t\t<p>はじめまして。<br>\n永瀬まみです。<br>\n<br>\n私も、2男1女を育てた母です。<br>\n<br>\n幼いころから特別な英才教育をしてきたわけではありません。<br>\n<br>\nごく普通の家庭で、<br>\n子どもたちを信じ、<br>\nたくさん話を聞き、<br>\n愛情をたっぷり注ぎながら子育てをしてきました。<br>\n<br>\nその結果、<br>\n<br>\n長男は医師に。<br>\n長女は特待生を経て幼稚園教諭に。<br>\n次男は国立大学を卒業し、独立行政法人で働いています。<br>\n<br>\nもちろん、<br>\n順風満帆だったわけではありません。<br>\n<br>\n悩んだ日も、<br>\n迷った日も、<br>\n子育てが思うようにいかない日もありました。<br>\n<br>\nそれでも私が大切にしてきたのは、<br>\n子どもを変えようとするのではなく、<br>\n親子で一緒に成長していくこと。<br>\n<br>\nその積み重ねが、<br>\n子どもたちの「自分で考え、自分で選ぶ力」を<br>\n育ててくれたのだと思っています。<br>\n<br>\n子どもが成長し、<br>\n少しずつ手が離れてきた頃、<br>\n私には、もう一つの想いが生まれました。<br>\n<br>\n<strong>「子育て経験を、誰かの役に立てられないだろうか。」</strong><br>\n<strong>「家族を大切にしながら、人の力になれる仕事がしたい。」</strong><br>\n<br>\nその想いから、<br>\n17年前に活動をスタートしました。<br>\n<br>\n子育て中は、<br>\n毎日が本当にあっという間です。<br>\n<br>\n母として。<br>\n妻として。<br>\n家族のために走り続ける毎日。<br>\n<br>\n気づけば、<br>\n自分のことはいつも後回し。<br>\n<br>\nそんなママを、<br>\n私はたくさん見てきました。<br>\n<br>\nだからこそ、伝えたいことがあります。<br>\n<br>\n<strong>ママだって、<br>\n自分の人生を大切にしていい。<br>\nやりたいことをやっていい。<br>\n好きなことを仕事にしていい。</strong><br>\n<br>\n子育てと仕事を、<br>\nどちらか一つ選ぶ必要はありません。<br>\n<br>\nどちらも大切にしながら、<br>\n自分らしく働くことはできます。<br>\n<br>\nそして、<br>\nそんなママが増えることが、<br>\n子どもたちの笑顔を増やし、<br>\n地域をもっとあたたかくしていく。<br>\n<br>\n私は、そう信じています。<br>\n<br>\nだから今も、<br>\n<strong>おうち育脳カウンセラーとして、<br>\nたくさんの親子と向き合い続けています。</strong></p>\n\t\t\t</div><!-- /con_profile -->\n\t\t</div><!-- /profile -->","sid":"","children":[]}]}]}]},{"id":900000101,"is_popup":0,"type":"section","class":"lp-disclaimer","sid":"","children":[{"id":900000102,"is_popup":0,"type":"row","sid":"","children":[{"id":900000103,"is_popup":0,"type":"col","sid":"","children":[{"id":900000104,"is_popup":0,"type":"html","text":"<p>※本ページに掲載している働き方や活動事例は一例です。受講後の活動内容、仕事の機会、収入や実績には個人差があり、すべての方に同様の結果を保証するものではありません。</p>","sid":"","children":[]}]}]}]},{"id":754635329,"is_popup":0,"type":"section","class":"footer","sid":"","children":[{"id":754635330,"is_popup":0,"type":"row","sid":"","children":[{"id":754635331,"is_popup":0,"type":"col","sid":"","children":[{"id":754635332,"is_popup":0,"type":"footer","color":"#ffffff","privacy":"https://eqno.mamaaka.com/p/privacy","asct":"https://eqno.mamaaka.com/p/law","copyright":"育脳子育てカウンセラー 運営事務局","background_color":"#ffffff","sid":"","children":[]}]}]}]},{"id":754635333,"is_popup":0,"type":"section","sid":"","children":[{"id":754635334,"is_popup":0,"type":"row","sid":"","children":[{"id":754635335,"is_popup":0,"type":"col","sid":"","children":[{"id":754635336,"is_popup":0,"type":"html","text":"<div class=\"flbtn\"><a href=\"#tokucho02\">無料で今すぐ5日間チャレンジプログラムに参加する</a></div><!--/flbtn-->","sid":"","children":[]}]}]}]}],"popupelements":[],"products":[],"actions":[],"forms":[],"funnel":{"id":125951,"id_str":"tIuqBmSeuvw6","funnel_group_id":0,"memo":null,"share_id":"SIjKFcmlg632","is_test_mode":0,"is_archived":0,"is_deleted":0,"status":"published","share_type":"email","from_funnel_id":null, <script>
document.addEventListener('DOMContentLoaded', function () {
	function fitFormNudge() {
		if (window.innerWidth > 599) {
			document.querySelectorAll('.form-nudge span').forEach(function (span) {
				span.style.fontSize = '';
			});
			document.querySelectorAll('.form-nudge-date').forEach(function (el) {
				el.style.fontSize = '';
			});
			return;
		}
		document.querySelectorAll('.form-nudge').forEach(function (el) {
			var span = el.querySelector('span');
			if (!span) {
				return;
			}
			var maxWidth = el.clientWidth;
			if (!maxWidth) {
				return;
			}
			var size = Math.min(28, Math.floor(maxWidth / 15));
			span.style.fontSize = size + 'px';
			while (size > 11 && span.scrollWidth > maxWidth) {
				size -= 0.5;
				span.style.fontSize = size + 'px';
			}
			var dateEl = el.nextElementSibling;
			if (dateEl && dateEl.classList.contains('form-nudge-date')) {
				dateEl.style.fontSize = size + 'px';
			}
		});
	}

	function insertWhoCopy() {
		var target = document.querySelector('.con_who');
		if (!target || target.querySelector('.who-copy')) {
			return;
		}

		var copy = document.createElement('div');
		copy.className = 'who-copy';
		copy.innerHTML = '1秒育脳®️で育つのは、知識だけではありません。<span class="who-point">IQの向上</span>はもちろん、<span class="who-point">ひらめき</span>、<span class="who-point">空間認識力</span>、<span class="who-point">豊かな感受性</span>、そして<span class="who-point">自ら学ぶ力</span>まで、子どもの未来につながる土台が育っていきます。';
		target.appendChild(copy);
	}

	function insertWhoCopySecondary() {
		var section = document.querySelector('.who');
		var anchor = document.querySelector('.wrap_who');
		if (!section || !anchor || section.querySelector('.who-copy-secondary')) {
			return;
		}

		var copy = document.createElement('div');
		copy.className = 'who-copy-secondary';
		copy.innerHTML = '子どもの未来を育てる関わり方は、<br><span class="who-point">あなたの未来</span>も変えていくかもしれません。<br><br>1秒育脳®を学ぶことで、<br>子どもの可能性を引き出す関わり方だけでなく、<br><br>ママたちの悩みに寄り添い、<br><span class="who-soft">親子をサポートできる知識とスキル</span>が身につきます。<br><br>そしてそのスキルは、<br><span class="who-lead">「自分の子育てに活かすだけ」</span><br><br>で終わるものではありません。<br><br>地域の親子の役に立ったり、<br>今のお仕事に取り入れたり、<br><span class="who-point">新しい働き方につながる可能性</span>もあるのです。';
		anchor.insertAdjacentElement('afterend', copy);
	}

	function insertWhoBridgeImage() {
		var section = document.querySelector('.who');
		var anchor = document.querySelector('.who-copy-secondary');
		if (!section || !anchor || section.querySelector('.who-bridge-image')) {
			return;
		}

		var image = document.createElement('div');
		image.className = 'who-bridge-image';
		anchor.insertAdjacentElement('afterend', image);
	}

	function insertProfileLogo() {
		var profile = document.querySelector('.profile');
		var anchor = document.querySelector('.con_profile p');
		if (!profile || !anchor || profile.querySelector('.profile-logo')) {
			return;
		}

		var logo = document.createElement('div');
		logo.className = 'profile-logo';
		anchor.insertAdjacentElement('afterend', logo);
	}

	insertWhoCopy();
	insertWhoCopySecondary();
	insertWhoBridgeImage();
	insertProfileLogo();
	fitFormNudge();
	window.setTimeout(insertWhoCopy, 300);
	window.setTimeout(insertWhoCopySecondary, 300);
	window.setTimeout(insertWhoBridgeImage, 300);
	window.setTimeout(insertProfileLogo, 300);
	window.setTimeout(fitFormNudge, 300);
	window.setTimeout(insertWhoCopy, 1200);
	window.setTimeout(insertWhoCopySecondary, 1200);
	window.setTimeout(insertWhoBridgeImage, 1200);
	window.setTimeout(insertProfileLogo, 1200);
	window.setTimeout(fitFormNudge, 1200);
	window.addEventListener('resize', fitFormNudge);
});
</script>
