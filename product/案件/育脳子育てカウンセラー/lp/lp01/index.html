<script>
$(function(){
  $('a[href^="#"]').click(function(){
    var speed = 300;
    var href= $(this).attr("href");
    var target = $(href == "#" || href == "" ? 'html' : href);
    var position = target.offset().top;
    $("html, body").animate({scrollTop:position}, speed, "swing");
    return false;
  });
	
	
  let $pagetop = $('.flbtn');

  $(window).on( 'scroll', function () {
    //スクロール位置を取得
    if ( $(this).scrollTop() < 1500 ) {
      $pagetop.css('opacity','0');
      $pagetop.css('display','none');
		
    } else {
      $pagetop.css('opacity','1');
      $pagetop.css('display','block');
    }
  });	
	
});
</script>

でも私は思うのです。<br>\n<br>\n<strong>ママだって、自分のことを考えていい。<br>\nママだって、自分の人生を生きていい。</strong><br>\n<br>\n限られた時間の中でも、<br>\nやりたいことをやっていい。<br>\n楽しんでいい。<br>\n自分の「好き」や「得意」を活かして、<br>\n子育てをしながら働くことだって、できる。<br>\n<br>\nそんな生き方が当たり前になったら、<br>\nきっと今よりもっと、子育てしやすくて、<br>\n助け合いがあって、あたたかい社会になっていく。<br>\n<br>\n<strong>私は、そんな想いで<br>\n育脳子育てカウンセラー®️として活動しています。</strong></p>\n\t\t\t</div><!-- /con_profile -->\n\t\t</div><!-- /profile -->","sid":"","children":[]}]}]}]},{"id":754635329,"is_popup":0,"type":"section","class":"footer","sid":"","children":[{"id":754635330,"is_popup":0,"type":"row","sid":"","children":[{"id":754635331,"is_popup":0,"type":"col","sid":"","children":[{"id":754635332,"is_popup":0,"type":"footer","color":"#ffffff","privacy":"https://eqno.mamaaka.com/p/privacy","asct":"https://eqno.mamaaka.com/p/law","copyright":"育脳子育てカウンセラー 運営事務局","background_color":"#ffffff","sid":"","children":[]}]}]}]},{"id":754635333,"is_popup":0,"type":"section","sid":"","children":[{"id":754635334,"is_popup":0,"type":"row","sid":"","children":[{"id":754635335,"is_popup":0,"type":"col","sid":"","children":[{"id":754635336,"is_popup":0,"type":"html","text":"<div class=\"flbtn\"><a href=\"#tokucho02\">無料で今すぐ5日間チャレンジプログラムに参加する</a></div><!--/flbtn-->","sid":"","children":[]}]}]}]}],"popupelements":[],"products":[],"actions":[],"forms":[],"funnel":{"id":125951,"id_str":"tIuqBmSeuvw6","funnel_group_id":0,"memo":null,"share_id":"SIjKFcmlg632","is_test_mode":0,"is_archived":0,"is_deleted":0,"status":"published","share_type":"email","from_funnel_id":null,"period_to":null,"url_closed":null,"webinar_format":"web","webinar_type":"day","webinar_registration_type":"default","webinar_period_minute":null,"webinar_day_after":null,"webinar_days":null,"webinar_count_per_day":null,"webinar_from_hour1":null,"webinar_from_min1":null,"webinar_to_hour1":null,"webinar_to_min1":null,"webinar_from_hour2":null,"webinar_from_min2":null,"webinar_to_hour2":null,"webinar_to_min2":null,"webinar_length_hour":null,"webinar_length_minute":null
