$(function(){
  $('a[href^="#"]').click(function(){
    var speed = 300;
    var href= $(this).attr("href");
    var target = $(href == "#" || href == "" ? 'html' : href);
    var position = target.offset().top;
    $("html, body").animate({scrollTop:position}, speed, "swing");
    return false;
  });
	
	
  let $pagetop = $('.flbtn');

  $(window).on( 'scroll', function () {
    //スクロール位置を取得
    if ( $(this).scrollTop() < 1500 ) {
      $pagetop.css('opacity','0');
      $pagetop.css('display','none');
		
    } else {
      $pagetop.css('opacity','1');
      $pagetop.css('display','block');
    }
  });	
	
});
</script>

003E\n\t\t\t\u003Ch2\u003E\u003Cimg src=\u0022https:\/\/utagesystem.s3.ap-northeast-1.amazonaws.com\/g5kxXfM1ukUE\/f8qoOenCimcPo5xTOmAGJpNZt6yGKnnaaPh8ux0I.png\u0022 alt=\u0022\u8b1b\u5e2b\u7d39\u4ecb\u0022\u003E\u003C\/h2\u003E\n\t\t\t\n\t\t\t\u003Cdiv class=\u0022con_profile\u0022\u003E\n\t\t\t\t\u003Cdiv class=\u0022shd_profile\u0022\u003E\n\t\t\t\t\t\u003Cpicture\u003E\n\t\t\t\t\t\t\u003Csource srcset=\u0022https:\/\/utagesystem.s3.ap-northeast-1.amazonaws.com\/g5kxXfM1ukUE\/IRZdUzYIFDPmhhSWgDZT4NMjxL5KNq7nam1GNsdj.png\u0022 media=\u0022(max-width: 768px)\u0022\u003E\n\t\t\t\t\t\t\u003Cimg class=\u0022tt_shdprofile\u0022 src=\u0022https:\/\/utagesystem.s3.ap-northeast-1.amazonaws.com\/g5kxXfM1ukUE\/gdZe5hp0Q0dcBDhO5JMk6Y29eAghQGKnOTh5LJz4.png\u0022\u003E\n\t\t\t\t\t\u003C\/picture\u003E\n\t\t\t\t\t\u003Cimg class=\u0022pic_profile\u0022 src=\u0022https:\/\/utagesystem.s3.ap-northeast-1.amazonaws.com\/g5kxXfM1ukUE\/ihIwPGaEDoeqbQrYevuPFCnFGVR1wPGJ8SI3Hp0R.jpg\u0022\u003E\n\t\t\t\t\u003C\/div\u003E\u003C!-- \/shd_profile --\u003E\n\t\t\t\t\n\t\t\t\t\u003Cp\u003E私も、2男1女の母です。\u003Cbr\u003E\n\u003Cbr\u003E\n幼いころから特別な英才教育をしてきたわけではありません。\u003Cbr\u003E\nごく普通の家庭で、ただただ愛情をたっぷり注いで子育てをしてきました。\u003Cbr\u003E\n\u003Cbr\u003E\nその結果、\u003Cbr\u003E\n\u003Cbr\u003E\n医者になった長男\u003Cbr\u003E\n特待生を経て幼稚園教諭になった長女\u003Cbr\u003E\n国立大学を卒業し、独立行政法人の団体職員として歩んでいる次男\u003Cbr\u003E\n\u003Cbr\u003E\n3人とも、自分のやりたいことを見つけて、\u003Cbr\u003E\n自分で選んだ道を、しっかりと歩んでいます。\u003Cbr\u003E\n\u003Cbr\u003E\nそんな子どもたちの成長を見守りながら、\u003Cbr\u003E\n私はずっと思っていました。\u003Cbr\u003E\n\u003Cbr\u003E\n\u003Cstrong\u003E「おかえり」と言える毎日を大切にしながら、\u003Cbr\u003E\n誰かの力になれる仕事がしたい。\u003C\/strong\u003E\u003Cbr\u003E\n\u003Cbr\u003E\nその想いから、17年前に起業しました。\u003Cbr\u003E\n\u003Cbr\u003E\n子育て中は、本当に毎日があっという間です。\u003Cbr\u003E\n母として、妻として、家族のために動いているうちに、\u003Cbr\u003E\n気づけば自分のことはいつも後回し。\u003Cbr\u003E\n\u003Cbr\u003E\nでも私は思うのです。\u003Cbr\u003E\n\u003Cbr\u003E\n\u003Cstrong\u003Eママだって、自分のことを考えていい。\u003Cbr\u003E\nママだって、自分の人生を生きていい。\u003C\/strong\u003E\u003Cbr\u003E\n\u003Cbr\u003E\n限られた時間の中でも、\u003Cbr\u003E\nやりたいことをやっていい。\u003Cbr\u003E\n楽しんでいい。\u003Cbr\u003E\n自分の「好き」や「得意」を活かして、\u003Cbr\u003E\n子育てをしながら働くことだって、できる。\u003Cbr\u003E\n\u003Cbr\u003E\nそんな生き方が当たり前になったら、\u003Cbr\u003E\nきっと今よりもっと、子育てしやすくて、\u003Cbr\u003E\n助け合いがあって、あたたかい社会になっていく。\u003Cbr\u003E\n\u003Cbr\u003E\n\u003Cstrong\u003E私は、そんな想いで\u003Cbr\u003E\n育脳子育てカウンセラー®️として活動しています。\u003C\/strong\u003E\u003C\/p\u003E\n\t\t\t\u003C\/div\u003E\u003C!-- \/con_profile --\u003E\n\t\t\u003C\/div\u003E\u003C!-- \/profile --\u003E","sid":"","children":[]}]}]}]},{"id":754635329,"is_popup":0,"type":"section","class":"footer","sid":"","children":[{"id":754635330,"is_popup":0,"type":"row","sid":"","children":[{"id":754635331,"is_popup":0,"type":"col","sid":"","children":[{"id":754635332,"is_popup":0,"type":"footer","color":"#ffffff","privacy":"https:\/\/eqno.mamaaka.com\/p\/privacy","asct":"https:\/\/eqno.mamaaka.com\/p\/law","copyright":"\u80b2\u8133\u5b50\u80b2\u3066\u30ab\u30a6\u30f3\u30bb\u30e9\u30fc \u904b\u55b6\u4e8b\u52d9\u5c40","background_color":"#ffffff","sid":"","children":[]}]}]}]},{"id":754635333,"is_popup":0,"type":"section","sid":"","children":[{"id":754635334,"is_popup":0,"type":"row","sid":"","children":[{"id":754635335,"is_popup":0,"type":"col","sid":"","children":[{"id":754635336,"is_popup":0,"type":"html","text":"\u003Cdiv class=\u0022flbtn\u0022\u003E\n\n\t\u003Ca href=\u0022#form\u0022\u003E\u7121\u6599\u3067\u4eca\u3059\u30505\u65e5\u9593\u30c1\u30e3\u30ec\u30f3\u30b8\u30d7\u30ed\u30b0\u30e9\u30e0\u306b\u53c2\u52a0\u3059\u308b\u003C\/a\u003E\n\n\u003C\/div\u003E\u003C!--\/flbtn--\u003E","sid":"","children":[]}]}]}]}],"popupelements":[],"products":[],"actions":[],"forms":[],"funnel":{"id":125951,"id_str":"tIuqBmSeuvw6","funnel_group_id":0,"memo":null,"share_id":"SIjKFcmlg632","is_test_mode":0,"is_archived":0,"is_deleted":0,"status":"published","share_type":"email","from_funnel_id":null,"period_to":null,"url_closed":null,"webinar_format":"web","webinar_type":"day"
