	<p class="article__meta">2026.09.18</p>
	<div class="article__hero"><img src="./blocksy-child/assets/images/dummy-01.jpg" alt=""></div>
	<div class="article__body">
		<p>好きなことがある。経験もある。ちゃんと伝えようともしている。なのに、選ばれない。</p><p>届かないとき、人は自分を疑う。「私には才能がないのかも」と思う夜がある。</p><p>でも多くの場合、足りないのは情熱ではない。届ける順番と、言葉の置き方がずれているだけだ。</p>
